<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Android WebView 140+ enables passthrough safe-area insets with viewport-fit=cover,
      // which misaligns pointer coordinates (https://issues.chromium.org/issues/40699457).
      if (/Android/i.test(navigator.userAgent)) {
        document
          .querySelector('meta[name="viewport"]')
          ?.setAttribute('content', 'width=device-width, initial-scale=1.0');
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500&family=IBM+Plex+Sans+SC:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Sans+Coptic:wght@400;500&family=Noto+Sans+Ethiopic:wght@400;500&family=Pacifico&family=Roboto:wght@400;500&display=swap"
      rel="stylesheet"
    />

  </head>
