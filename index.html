<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Lock Android viewport before first layout. Do not set width=innerWidth here —
      // on tablets it can be wrong until the WebView finishes layout and causes a zoom flash.
      if (/Android/i.test(navigator.userAgent)) {
        document
          .querySelector('meta[name="viewport"]')
          ?.setAttribute(
            'content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no',
          );

        var syncAndroidViewportMetrics = function () {
          document.documentElement.style.setProperty('--app-width', Math.round(window.innerWidth) + 'px');
          document.documentElement.style.setProperty('--app-height', Math.round(window.innerHeight) + 'px');
        };

        syncAndroidViewportMetrics();
        document.addEventListener('DOMContentLoaded', syncAndroidViewportMetrics);
        window.addEventListener('resize', syncAndroidViewportMetrics);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500&family=IBM+Plex+Sans+Devanagari:wght@400;500&family=IBM+Plex+Sans+Hebrew:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500&family=IBM+Plex+Sans+SC:wght@400;500&family=IBM+Plex+Sans+Thai:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Sans+Coptic:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Ethiopic:wght@400;500&family=Pacifico&family=Roboto:wght@400;500&family=Vazirmatn:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Almaniac</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
